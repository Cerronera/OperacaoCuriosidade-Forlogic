<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação Comunidade - Cadastro</title>
    <link rel="stylesheet" href="style_cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/imagens/icon.png" type="image/x-icon">
    <style>
        h1 {
            font-family: 'Montserrat', Helvetica, sans-serif;
            font-weight: normal;
            font-size: 3em;
        }
    </style>
</head>

<body>
    <div class="cadastro">
        <form id="form_dados" action="" method="post">
            <div style="display: flex; justify-content: center; padding: auto;">
                <h1>CADASTRO</h1>
            </div>
            <div class="form_cadastro">
                <label for="inome">Nome:</label>
                <input type="text" id="inome" name="nome" required autofocus>
                <a>Mensagem de Erro</a>
            </div>
            <div class="form_cadastro">
                <label for="iidade">Idade:</label>
                <input type="number" id="iidade" name="idade" required>
                <a>Mensagem de Erro</a>
            </div>
            <div class="form_cadastro">
                <label for="itelefone">Telefone:</label>
                <input type="tel" id="itelefone" name="telefone" required>
                <a>Mensagem de Erro</a>
            </div>
            <div class="form_cadastro">
                <label for="iemail">Email:</label>
                <input type="email" id="iemail" name="email" required>
                <a>Mensagem de Erro</a>
            </div>
            <div class="form_cadastro">
                <label for="iendereco">Endereço:</label>
                <input type="text" id="iendereco" name="endereco" required>
                <a>Mensagem de Erro</a>
            </div>
            <div class="form_cadastro">
                <label for="isenha">Senha:</label>
                <input type="password" id="isenha" name="senha" required>
                <a>Mensagem de Erro</a>
            </div>
            <div class="form_cadastro">
                <label for="iconfirmarsenha">Confirmar Senha:</label>
                <input type="password" id="iconfirmarsenha" name="confirmarsenha" required>
                <a>Mensagem de Erro</a>
            </div>
            <div class="form_cadastro">
                <label for="ioutros">Outras Informações:</label>
                <input type="text" id="ioutros" name="outrasinformacoes" required>
                <a>Mensagem de Erro</a>
            </div>

            <div class="form_cadastro">
                <div class="checkbox">
                    <input type="checkbox" id="iativo" name="ativo">
                    <label for="iativo">Ativo</label>
                </div>
            </div>
            <div class="btn">
                <button type="submit" class="btn" id="submit">Registrar </button>
            </div>
        </form>
    </div> <!-- div do cadastro-->
    <script src="script_cadastro.js"></script>
</body>

</html>
