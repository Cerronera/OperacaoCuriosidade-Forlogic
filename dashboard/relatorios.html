<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação Curiosidade - Relatórios</title>
    <link rel="stylesheet" href="style_dashboard.css" media="screen">
    <link rel="stylesheet" href="style_impressora.css" media="print">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="/imagens/icon.png" type="image/x-icon">
</head>

<body>
    <nav class="sidebar">
        <div class="oc">
            <h1>OC</h1>
            <p>Operação Curiosidade</p>
        </div>
        <ul>
            <li><img src="/imagens/home.png" alt="Home"><a href="#" onclick="voltar_home()">Home</a></li>
            <li><img src="/imagens/add.png" alt="Cadastro"><a href="#" onclick="ir_cadastros()">Cadastro</a></li>
            <li><img src="/imagens/relatorio.png" alt="Relatorio"><a href="#" onclick="ir_relatorios()">Relatórios</a>
            </li>
        </ul>
    </nav>
    <div class="principal">
        <header class="dashboard">
            <div class="posicao_resultado">
                <input type="text" placeholder="Pesquisar..." class="pesquisa" id="campoPesquisa">
                <div id="resultadosPesquisa" class="resultados"></div>
            </div>

            <div class="usuario">
                <img src="/imagens/user.png" alt="Usuario">
                <span class="usuario_nome">Nome do Usuário</span>
                <span class="sair"><a href="#" onclick="voltar_login()"><img src="/imagens/logout.png"
                            alt="Sair"></span></a>
            </div>
        </header>

        <main>
            <div class="cadastros-relatorios">
                <div class="cadastros-relatorios-header">
                    <h2>Relatórios</h2>
                    <div class=btn_imp>
                        <button class="btn" id="btn_imp">IMPRIMIR</button>
                    </div>
                </div>

                <table id="tabela_usuarios">
                    <thead>
                        <tr>
                            <th>NOME</th>
                            <th>E-MAIL</th>
                            <th>TELEFONE</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
                <div id="paginacao" class="paginacao-container"></div>
            </div>
        </main>
    </div>

    <script src="script_relatorios.js"></script>
</body>

</html>
