<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação Curiosidade - Cadastros</title>
    <link rel="stylesheet" href="style_dashboard.css">
    <link rel="shortcut icon" href="/imagens/icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="sidebar">
        <div class="oc">
            <h1>OC</h1>
            <p>Operação Curiosidade</p>
        </div>
        <ul>
            <li><img src="/imagens/home.png" alt="Home"><a href="#" onclick="voltar_home()">Home</a></li>
            <li><img src="/imagens/add.png" alt="Cadastro"><a href="#" onclick="ir_cadastros()">Cadastro</a></li>
            <li><img src="/imagens/relatorio.png" alt="Relatorio"><a href="#" onclick="ir_relatorios()">Relatórios</a>
            </li>
        </ul>
    </nav>
   <div class="principal">
        <header class="dashboard">
            <div class="posicao_resultado">
                <input type="text" placeholder="Pesquisar..." class="pesquisa" id="campoPesquisa">
                <div id="resultadosPesquisa" class="resultados"></div>
            </div>

            <div class="usuario">
                <img src="/imagens/user.png" alt="Usuario">
                <span class="usuario_nome">Nome do Usuário</span>
                <span class="sair"><a href="#" onclick="voltar_login()"><img src="/imagens/logout.png"
                            alt="Sair"></span></a>
            </div>
        </header>

        <main>
            <div class="cadastros">
                <div class="cadastros_header">
                    <h2>Cadastros</h2>
                    <div class=btn>
                        <button type="submit" class="btn" id="submitbtn" onclick="abrirNovoCadastro()">NOVO
                            CADASTRO</button>
                    </div>
                </div>
                <table id="tabela_usuarios">
                    <thead>
                        <tr>
                            <th>NOME</th>
                            <th>E-MAIL</th>
                            <th>TELEFONE</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
            <div id="modal_edicao" class="modal oculto">
                <form id="form_edicao">
                    <div class="form_modal">
                        <button type="button" class="fechar" onclick="fecharModal()"><img src="/imagens/fechar.png"
                                alt="fechar"></button>
                        <label for="edit_nome">Nome:</label>
                        <input type="text" id="edit_nome" required>
                        <p><a>erro</a></p>
                    </div>

                    <div class="form_modal">
                        <label for="edit_idade">Idade:</label>
                        <input type="number" id="edit_idade" required>
                        <p><a>erro</a></p>
                    </div>

                    <div class="form_modal">
                        <label for="edit_email">E-mail:</label>
                        <input type="email" id="edit_email" required>
                        <p><a>erro</a></p>
                    </div>

                    <div class="form_modal">
                        <label for="edit_telefone">Telefone:</label>
                        <input type="text" id="edit_telefone" placeholder="(99) 9999-9999" required>
                        <p><a>erro</a></p>
                    </div>

                    <div class="form_modal">
                        <label for="edit_endereco">Endereço:</label>
                        <input type="text" id="edit_endereco" required>
                        <p><a>erro</a></p>
                    </div>

                    <div class="form_modal">
                        <label for="edit_outros">Outras Informações :</label>
                        <textarea id="edit_outros" required></textarea>
                        <p><a>erro</a></p>
                    </div>
                    <div class="form_modal">
                        <label for="edit_interesses">Interesses:</label>
                        <textarea id="edit_interesses" required></textarea>
                        <p><a>erro</a></p>
                    </div>

                    <div class="form_modal">
                        <label for="edit_sentimentos">Sentimentos:</label>
                        <textarea id="edit_sentimentos" required></textarea>
                        <p><a>erro</a></p>
                    </div>
                    <div class="form_modal">
                        <label for="edit_valores">Valores:</label>
                        <textarea id="edit_valores" required></textarea>
                        <p><a>erro</a></p>
                    </div>

                    <div class="checkbox">
                        <label><input type="checkbox" id="edit_ativo">Ativo</label>
                    </div>
                    <div class="form_modal">
                        <div class="btn">
                            <button type="button" id="salvar">Salvar Alterações</button>
                            <button type="button" id="cancelar">Cancelar</button>
                        </div>
                        <div class="btn_excluir">
                            <button type="button" id="excluir" id="excluir"><img src="/imagens/delete.png"
                                    alt="deletar"></a></button>
                        </div>
                    </div>
            </div>
            </form>
    </div>

    </main>
    </div>
    <script src="script_modal.js"></script>
    <script src="script_blocos.js"></script>
</body>

</html>
