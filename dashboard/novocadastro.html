<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação Curiosidade - Novo Cadastro</title>
    <link rel="stylesheet" href="style_dashboard.css">
    <link rel="shortcut icon" href="/imagens/icon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="sidebar">
        <div class="oc">
            <h1>OC</h1>
            <p>Operação Curiosidade</p>
        </div>
        <ul>
            <li><img src="/imagens/home.png" alt="Home"><a href="#" onclick="voltar_home()">Home</a></li>
            <li><img src="/imagens/add.png" alt="Cadastro"><a href="#" onclick="ir_cadastros()">Cadastro</a></li>
            <li><img src="/imagens/relatorio.png" alt="Relatorio"><a href="#" onclick="ir_relatorios()">Relatórios</a>
            </li>
        </ul>
    </nav>

    <div class="principal">
        <header class="dashboard">
            <input type="text" placeholder="Pesquisar..." class="pesquisa">

            <div class="usuario">
                <img src="/imagens/user.png" alt="Usuario">
                <span class="usuario_nome">Nome do Usuário</span>
                <spac class="sair"><a href="#" onclick="voltar_login()"><img src="/imagens/logout.png"
                            alt="Sair"></span></a>
            </div>
        </header>
        <main>
            <div class="novo_cadastro">

                <h2>Novo Cadastro</h2>
                <h3>1° Fatos e Dados</h3>
                <form id="form_novo_cadastro" action="" method="post" autocomplete="off">
                    <div class="checkbox">
                        <input type="checkbox" id="idativo" name="status">
                        <label for="idativo">Ativo</label>
                    </div>
                    <div class="form">
                        <label for="idnome">Nome:</label>
                        <input type="text" id="idnome" name="nome" required>
                        <a>erro</a>
                    </div>
                    <div class="form">
                        <label for="ididade">Idade:</label>
                        <input type="number" id="ididade" name="idade" required>
                        <a>erro</a>
                    </div>
                    <div class="form">
                        <label for="idemail">E-mail:</label>
                        <input type="email" id="idemail" name="email" required>
                        <a>erro</a>
                    </div>
                    <div class="form">
                        <label for="idtelefone">Telefone:</label>
                        <input type="text" id="idtelefone" name="telefone" maxlength="15" placeholder="(99) 99999-9999">
                        <a>erro</a>
                    </div>
                    <div class="form">
                        <label for="idendereco">Endereço:</label>
                        <input type="text" name="endereo" id="idendereco" required>
                        <a>erro</a>
                    </div>
                    <div class="form">
                        <label for="idoutros">Outras Informações:</label>
                        <textarea name="outrasinformacoes" id="idoutros" required></textarea>
                        <a>erro</a>
                    </div>
                    <h3>2° Interesses</h3>
                    <div class="form">
                        <textarea name="interesses" id="idinteresses"  required></textarea>
                        <a>erro</a>
                    </div>

                    <h3>3° Sentimentos</h3>
                    <div class="form">
                        <textarea name="Sentimentos" id="idsentimentos"  required></textarea>
                        <a>erro</a>
                    </div>

                    <h3>4° Valores</h3>
                    <div class="form">
                        <textarea name="valores" id="idvalores" required></textarea>
                        <a>erro</a>
                    </div>
                    <div class="btn">
                        <button type="submit" class="btn" id="submit">GRAVAR </button>
                    </div>
                </form>
            </div>
            <script src="script_dashboard.js"></script>
        </main>
    </div>
</body>

</html>
