<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação Comunidade - Dashboard</title>
    <link rel="stylesheet" href="style_dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="/imagens/icon.png" type="image/x-icon">
</head>

<body>
    <nav class="sidebar">
        <div class="oc">
            <h1>OC</h1>
            <p>Operação Curiosidade</p>
        </div>
        <ul>
            <li><img src="/imagens/home.png" alt="Home"><a href="#" onclick="voltar_home()">Home</a></li>
            <li><img src="/imagens/add.png" alt="Cadastro"><a href="#" onclick="ir_cadastros()">Cadastro</a></li>
            <li><img src="/imagens/relatorio.png" alt="Relatorio"><a href="#" onclick="ir_relatorios()">Relatórios</a>
            </li>
        </ul>
    </nav>
    <div class="principal">
        <header class="dashboard">
            <input type="text" placeholder="Pesquisar..." class="pesquisa">

            <div class="usuario">
                <img src="/imagens/user.png" alt="Usuario">
                <span class="usuario_nome">Nome do Usuário</span>
                <spac class="sair"><a href="#" onclick="voltar_login()"><img src="/imagens/logout.png"
                            alt="Sair"></span></a>
            </div>
        </header>

        <main>
            <div class="todos_blocos">
                <div class="bloco">
                    <h1 style="color:rgb(56, 56, 214)" id="bloco_1">0</h1>
                    <h2>Total de cadastros</h2>
                </div>
                <div class="bloco" >
                    <h1 style="color:rgb(50, 165, 50)" id="bloco_2">0</h1>
                    <h2>Cadastros no último mês</h2>
                </div>
                <div class="bloco">
                    <h1 style="color:rgb(189, 62, 62)" id="bloco_3">0</h1>
                    <h2>Cadastros com pendência de revisão</h2>
                </div>
            </div>

            <div class="tabela">
                <h2>Últimos Cadastros</h2>
                <table id="tabela_usuarios">
                    <thead>
                        <tr>
                            <th>NOME</th>
                            <th>E-MAIL</th>
                            <th>TELEFONE</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script_dashboard.js"></script>
    <script src="script_blocos.js"></script>
</body>

</html>
